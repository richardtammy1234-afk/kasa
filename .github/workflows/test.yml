name: Testler
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Birim testleri
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Tarayıcı testi (sahte Firebase)
        run: npm run test:e2e
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Gerçek Firebase SDK + yerel emülatör testi
        run: npm run test:emulator
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ekran-goruntuleri
          path: test-results/
